<!DOCTYPE html>
<html lang="zh-TW">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for winning effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #FFFDF0 0%, #FEF9C3 50%, #FEF3C7 100%);
            color: #374151;
            min-height: 100vh;
        }

        .font-rounded {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
        }

        /* Ruby Zhuyin styling */
        ruby {
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 0 4px;
            line-height: 1.8;
        }

        rt {
            font-size: 0.42em;
            color: #D97706;
            font-weight: 700;
            line-height: 1.1;
            user-select: none;
        }

        /* Mic Pulsing Effects */
        @keyframes mic-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .listening-active {
            animation: mic-pulse 1.5s infinite;
            background-color: #EF4444 !important;
        }

        /* Golden Glow for Missing Character Tile */
        @keyframes tile-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); border-color: #F59E0B; }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.9); border-color: #D97706; }
        }

        .missing-tile {
            animation: tile-glow 2s infinite;
            background: #FEF3C7;
        }

        @keyframes fill-success {
            0% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .tile-revealed {
            animation: fill-success 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            background-color: #10B981 !important;
            color: white !important;
        }

        /* Soundwave bar indicator */
        .bar {
            width: 4px;
            height: 16px;
            background-color: #EF4444;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }

        @keyframes wave {
            0%, 100% { height: 8px; }
            50% { height: 28px; }
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen selection:bg-amber-200">

    <script>

                example: '例句：我們應該主動尋求機會，而不是守株待兔。'
            },
            {

                zhuyin: ['ㄏㄨㄚˋ', 'ㄕㄜˊ', 'ㄊㄧㄢ', 'ㄗㄨˊ'],
                missingIndex: 3, // Missing '足'
                category: 'animal',
                categoryName: '🐶 動物篇',
                meaning: '比喻多此一舉，不但無益，反而不合適。',
                example: '例句：這幅畫已經很完美了，再加色彩簡直是畫蛇添足。'
            },
            {
                idiom: '胸有成竹',
                zhuyin: ['ㄒㄧㄨㄥ', 'ㄧㄡˇ', 'ㄔㄥˊ', 'ㄓㄨˊ'],
                missingIndex: 3, // Missing '竹'
                category: 'plant',
                categoryName: '🌱 植物篇',
                meaning: '比喻做事之前心中已有完整的謀劃與把握。',
                example: '例句：對於這次的國語演講比賽，他早已胸有成竹。'
            },
            {
                idiom: '千鈞一髮',
                zhuyin: ['ㄑㄧㄢ', 'ㄐㄩㄣ', 'ㄧˋ', 'ㄈㄚˇ'],
                missingIndex: 0, // Missing '千'
                category: 'number',
                categoryName: '🔢 數字篇',
                meaning: '比喻情況極為危急迫切。',
                example: '例句：在這千鈞一髮的時刻，消防隊員英勇地救出了小孩。'
            },
            {
                idiom: '水落石出',
                zhuyin: ['ㄕㄨㄟˇ', 'ㄌㄨㄛˋ', 'ㄕˊ', 'ㄔㄨ'],
                missingIndex: 2, // Missing '石'
                category: 'nature',
                categoryName: '☁️ 自然篇',
                meaning: '比喻事情的真相完全大白。',
                example: '例句：經過警察連日調查，這件失竊案終於水落石出了。'
            },
            {
                idiom: '井底之蛙',
                zhuyin: ['ㄐㄧㄥˇ', 'ㄉㄧˇ', 'ㄓ', 'ㄨㄚ'],
                missingIndex: 3, // Missing '蛙'
                category: 'animal',
                categoryName: '🐶 動物篇',
                meaning: '比喻見識狹小、眼界短淺的人。',
                example: '例句：多出國走走看看，才不會成為井底之蛙。'
            },
            {
                idiom: '雨過天晴',
                zhuyin: ['ㄩˇ', 'ㄍㄨㄛˋ', 'ㄊㄧㄢ', 'ㄑㄧㄥˊ'],
                missingIndex: 3, // Missing '晴'
                category: 'nature',
                categoryName: '☁️ 自然篇',
                meaning: '比喻壞的情況過去，好轉的情況到來。',
                example: '例句：這場誤會解釋清楚後，大家的心情便雨過天晴了。'
            },
            {
                idiom: '世外桃源',
                zhuyin: ['ㄕˋ', 'ㄨㄞˋ', 'ㄊㄠˊ', 'ㄩㄢˊ'],
                missingIndex: 2, // Missing '桃'
                category: 'plant',
                categoryName: '🌱 植物篇',
                meaning: '比喻風景優美、環境安樂的理想地方。',
                example: '例句：這座山村風景秀麗、空氣清新，真像個世外桃源。'
            },
            {
                idiom: '一箭雙雕',
                zhuyin: ['ㄧˊ', 'ㄐㄧㄢˋ', 'ㄕㄨㄤ', 'ㄉㄧㄠ'],
                missingIndex: 2, // Missing '雙'
                category: 'number',
                categoryName: '🔢 數字篇',
                meaning: '比喻做一件事同時達到兩種目的。',
                example: '例句：參加這次訓練既能學到新技能又能結交朋友，真是一箭雙雕。'
            },
            {
                idiom: '亡羊補牢',
                zhuyin: ['ㄨㄤˊ', 'ㄧㄤˊ', 'ㄅㄨˇ', 'ㄌㄠˊ'],
                missingIndex: 1, // Missing '羊'
                category: 'animal',
                categoryName: '🐶 動物篇',
                meaning: '比喻犯錯或受損後及時採取補救措施，防止繼續損失。',
                example: '例句：雖然之前考砸了，但只要現在亡羊補牢努力複習還來得及。'
            },
            {
                idiom: '風吹草動',
                zhuyin: ['ㄈㄥ', 'ㄔㄨㄟ', 'ㄘㄠˇ', 'ㄉㄨㄥˋ'],
                missingIndex: 2, // Missing '草'
                category: 'plant',
                categoryName: '🌱 植物篇',
                meaning: '比喻輕微的動靜或風浪。',
                example: '例句：他生性警覺，稍微有一點風吹草動就會立刻醒來。'
            },
            {
                idiom: '九牛一毛',
                zhuyin: ['ㄐㄧㄡˇ', 'ㄋㄧㄡˊ', 'ㄧˋ', 'ㄇㄠˊ'],
                missingIndex: 0, // Missing '九'
                category: 'number',
                categoryName: '🔢 數字篇',
                meaning: '比喻極大數量中的極小部分，微不足道。',
                example: '例句：這點花費對富翁來說不過是九牛一毛。'
            }
        ];

        // State variables
        let currentFilteredList = [...idiomDatabase];
        let currentIndex = 0;
        let score = 0;
        let isListening = false;
        let recognition = null;
        let synth = window.speechSynthesis;
        let isSolved = false;

        // Web Audio API synth sound generator
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playSoundEffect(type) {
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    // Two chime tones
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3); // G5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'error') {
                    // Low buzz
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.setValueAtTime(130, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {
                console.log('Audio playback initialized on click');
            }
        }

        // Initialize Speech Recognition Engine
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                document.getElementById('statusText').innerText = '您的瀏覽器不支援 Web Speech 語音辨識，請使用 Chrome 瀏覽器或點擊下方文字輸入。';
                document.getElementById('micBtn').classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                document.getElementById('micBtn').classList.add('listening-active');
                document.getElementById('micIcon').className = 'fa-solid fa-microphone-lines text-3xl animate-bounce';
                document.getElementById('micLabel').innerText = '聆聽中...';
                document.getElementById('waveVisualizer').classList.remove('hidden');
                document.getElementById('waveVisualizer').classList.add('flex');
                document.getElementById('statusText').innerText = '請清晰唸出完整的四字成語...';
                document.getElementById('statusText').className = 'text-sm font-bold text-red-600 bg-red-100 px-4 py-1.5 rounded-full';
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                // Clean transcript removing spaces and punctuation
                const cleanTranscript = transcript.replace(/[^\u4e00-\u9fa5]/g, '');
                document.getElementById('transcriptResult').innerText = `「${cleanTranscript || '正在收音...'}」`;

                const currentItem = currentFilteredList[currentIndex];

                // Check if spoken result contains the key idiom
                if (cleanTranscript.includes(currentItem.idiom)) {
                    recognition.stop();
                    handleAnswerSuccess();
                }
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                stopListeningUI();
                if (event.error === 'no-speech') {
                    document.getElementById('statusText').innerText = '未偵測到聲音，請再試一次或提高說話音量。';
                } else if (event.error === 'not-allowed') {
                    document.getElementById('statusText').innerText = '請在瀏覽器設定中允許麥克風權限以進行聲控。';
                }
            };

            recognition.onend = function() {
                stopListeningUI();
            };
        }

        function stopListeningUI() {
            isListening = false;
            document.getElementById('micBtn').classList.remove('listening-active');
            document.getElementById('micIcon').className = 'fa-solid fa-microphone text-2xl';
            document.getElementById('micLabel').innerText = '開始唸成語';
            document.getElementById('waveVisualizer').classList.add('hidden');
            document.getElementById('waveVisualizer').classList.remove('flex');
            
            if (!isSolved) {
                document.getElementById('statusText').innerText = '點擊麥克風按鈕開始語音答題';
                document.getElementById('statusText').className = 'text-sm font-bold text-amber-800 bg-amber-100/70 px-4 py-1.5 rounded-full';
            }
        }

        function toggleSpeechRecognition() {
            if (isSolved) {
                nextLevel();
                return;
            }

            if (!recognition) {
                initSpeechRecognition();
                if (!recognition) return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        // Render current level puzzle
        function renderCurrentPuzzle() {
            isSolved = false;
            const currentItem = currentFilteredList[currentIndex];

            // Update Header Stats
            document.getElementById('levelText').innerText = currentIndex + 1;
            document.getElementById('totalLevelText').innerText = currentFilteredList.length;
            document.getElementById('categoryBadge').innerHTML = `<i class="fa-solid fa-bookmark"></i> ${currentItem.categoryName}`;
            document.getElementById('meaningText').innerText = currentItem.meaning;
            document.getElementById('exampleText').innerText = currentItem.example;
            document.getElementById('transcriptResult').innerText = '「等待發音中...」';
            
            document.getElementById('statusText').innerText = '請按下下方「紅色麥克風」開始對著麥克風唸出完整四字成語';
            document.getElementById('statusText').className = 'text-sm font-bold text-amber-800 bg-amber-100/70 px-4 py-1.5 rounded-full';

            // Construct character tiles
            const container = document.getElementById('puzzleContainer');
            container.innerHTML = '';

            for (let i = 0; i < 4; i++) {
                const char = currentItem.idiom[i];
                const zy = currentItem.zhuyin[i];
                const isMissing = (i === currentItem.missingIndex);

                const tile = document.createElement('div');
                
                if (isMissing) {
                    tile.id = 'missingTileBlock';
                    tile.className = 'missing-tile w-16 h-20 sm:w-24 sm:h-28 rounded-2xl border-4 border-dashed border-amber-400 flex flex-col items-center justify-center font-black text-2xl sm:text-4xl text-amber-600 shadow-md transition-all relative';
                    tile.innerHTML = `
                        <ruby class="select-none">
                            <span class="opacity-30">＿</span>
                            <rt class="text-amber-600 font-bold">${zy}</rt>
                        </ruby>
                        <span class="absolute -bottom-2 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">謎底</span>
                    `;
                } else {
                    tile.className = 'w-16 h-20 sm:w-24 sm:h-28 bg-white rounded-2xl border-2 border-amber-300 flex flex-col items-center justify-center font-black text-2xl sm:text-4xl text-slate-800 shadow-md';
                    tile.innerHTML = `
                        <ruby class="select-none">
                            ${char}
                            <rt>${zy}</rt>
                        </ruby>
                    `;
                }

                container.appendChild(tile);
            }
        }

        // Answer Success Handler
        function handleAnswerSuccess() {
            if (isSolved) return;
            isSolved = true;

            const currentItem = currentFilteredList[currentIndex];
            playSoundEffect('success');

            // Reveal the missing tile
            const missingTile = document.getElementById('missingTileBlock');
            if (missingTile) {
                missingTile.className = 'w-16 h-20 sm:w-24 sm:h-28 rounded-2xl border-2 border-emerald-500 flex flex-col items-center justify-center font-black text-2xl sm:text-4xl shadow-xl tile-revealed';
                missingTile.innerHTML = `
                    <ruby class="select-none">
                        ${currentItem.idiom[currentItem.missingIndex]}
                        <rt class="text-white">${currentItem.zhuyin[currentItem.missingIndex]}</rt>
                    </ruby>
                `;
            }

            // Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Update Score
            score += 10;
            document.getElementById('scoreText').innerText = score;

            document.getElementById('statusText').innerText = '🎉 太棒了！唸得非常標準，答對過關！';
            document.getElementById('statusText').className = 'text-sm font-bold text-emerald-700 bg-emerald-100 px-4 py-1.5 rounded-full';

            // Show Victory Modal
            setTimeout(() => {
                document.getElementById('victoryDetailText').innerText = `成語【${currentItem.idiom}】語音辨識完全正確！`;
                document.getElementById('victoryModal').classList.remove('hidden');
            }, 800);
        }

        function closeVictoryModalAndNext() {
            document.getElementById('victoryModal').classList.add('hidden');
            nextLevel();
        }

        // TTS Speech Model Demonstration
        function playModelSpeech() {
            const currentItem = currentFilteredList[currentIndex];
            if ('speechSynthesis' in window) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(currentItem.idiom);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.8; // Slow for primary school learners
                synth.speak(utterance);
            }
        }

        // Category Switcher
        function switchCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-white text-amber-800 hover:bg-amber-100 border border-amber-200 transition-all';
            });
            
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = 'cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-white shadow transition-all';
            }

            if (cat === 'all') {
                currentFilteredList = [...idiomDatabase];
            } else {
                currentFilteredList = idiomDatabase.filter(item => item.category === cat);
            }

            currentIndex = 0;
            renderCurrentPuzzle();
        }

        function nextLevel() {
            if (currentIndex < currentFilteredList.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back
            }
            renderCurrentPuzzle();
        }

        function prevLevel() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = currentFilteredList.length - 1;
            }
            renderCurrentPuzzle();
        }

        // Manual Input Modal Functions
        function toggleManualInputModal() {
            const modal = document.getElementById('manualModal');
            modal.classList.toggle('hidden');
            document.getElementById('manualAnswerInput').value = '';
        }

        function submitManualAnswer() {
            const inputVal = document.getElementById('manualAnswerInput').value.trim();
            const currentItem = currentFilteredList[currentIndex];

            if (inputVal === currentItem.idiom) {
                toggleManualInputModal();
                handleAnswerSuccess();
            } else {
                playSoundEffect('error');
                alert(`答錯囉！提示：答案是四個字的成語。`);
            }
        }

        // Initialize on load
        window.onload = function() {
            initSpeechRecognition();
            renderCurrentPuzzle();
        };
    </script>
</body>
</html>
